name: Análise diária B3

on:
  schedule:
    # 22:00 UTC = 19:00 horário de Brasília (após o fechamento do pregão)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions

jobs:
  analisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar análise diária e notificar Telegram
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          OPTIONS_API_TOKEN: ${{ secrets.OPTIONS_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/rodar_diario.py

      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report/output
